<!DOCTYPE html>
<html lang="en">
  <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="./src/output.css">
        
        <title>Frontend Mentor | QR code component</title>

       
  </head>

  <body class="bg-slate-light flex flex-col justify-center items-center min-h-screen p-6">

       
    <main class="bg-white rounded-[20px] p-4 pb-10 max-w-[320px] w-full text-center">
        <img src="./images/image-qr-code.png" 
        alt="A white QR code form in a blue caed"
        class="w-full rounded-[10px]"/>
        

      <div class="px-3 pt-6">
        <h1 class="text-slate-dark text-[22px] font-bold leading-[1.2] mb-4">
          Improve your front-end skills by building projects
        </h1>
        <p class="text-slate-text text-[15px] leading-[1.4] tracking-[0.2px]">
          Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
        </p>
      </div>

    </main>

        
    <footer class="text-[11px] text-center mt-6 text-slate-dark">

      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
      Coded by <a href="#">cedrick mbuyamba</a>.

    </footer>
  </body>
</html>
